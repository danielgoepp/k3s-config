---
apiVersion: v1
kind: Namespace
metadata:
  name: n8n

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
  labels:
    app: n8n
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: n8n
  revisionHistoryLimit: 0
  template:
    metadata:
      labels:
        app: n8n
    spec:
      # Service links would inject N8N_PORT=tcp://... into the runners sidecar.
      enableServiceLinks: false
      containers:
      - name: n8n
        image: n8nio/n8n:2.49.3
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: "100m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        env:
        - name: VUE_APP_URL_BASE_API
          value: "https://n8n-prod.goepp.net/"
        - name: GENERIC_TIMEZONE
          value: "America/New_York"
        - name: TZ
          value: "America/New_York"
        - name: "N8N_HOST"
          value: "n8n-prod.goepp.net"
        - name: "N8N_PORT"
          value: "5678"
        - name: "N8N_PROTOCOL"
          value: "http"
        # Public URLs (behind ingress TLS). Without these, n8n advertises
        # http://<host>:5678 in OAuth metadata, which breaks MCP OAuth clients.
        - name: N8N_EDITOR_BASE_URL
          value: "https://n8n-prod.goepp.net/"
        - name: N8N_WEBHOOK_URL
          value: "https://n8n-prod.goepp.net/"
        - name: N8N_PROXY_HOPS
          value: "1"
        - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
          value: "true"
        - name: N8N_MIGRATE_FS_STORAGE_PATH
          value: "true"
        - name: N8N_DIAGNOSTICS_ENABLED
          value: "false"
        - name: N8N_TEMPLATES_ENABLED
          value: "false"
        - name: N8N_VERSION_NOTIFICATIONS_ENABLED
          value: "false"  
        - name: EXTERNAL_FRONTEND_HOOKS_URLS
          value: ""
        - name: N8N_DIAGNOSTICS_CONFIG_FRONTEND
          value: ""
        - name: N8N_DIAGNOSTICS_CONFIG_BACKEND
          value: ""
        - name: N8N_BASIC_AUTH_ACTIVE
          value: "true"
        - name: N8N_BASIC_AUTH_USER
          value: "n8n"
        - name: N8N_BASIC_AUTH_PASSWORD
          value: "n8n"
        - name: N8N_ENCRYPTION_KEY
          value: "n8n"
        # Sandbox service (see n8n-sandbox-prod.yaml)
        - name: N8N_INSTANCE_AI_SANDBOX_ENABLED
          value: "true"
        - name: N8N_INSTANCE_AI_SANDBOX_PROVIDER
          value: "n8n-sandbox"
        - name: N8N_INSTANCE_AI_SANDBOX_API_URL
          value: "http://sandbox-api:8080"
        - name: N8N_SANDBOX_SERVICE_URL
          value: "http://sandbox-api:8080"
        - name: N8N_SANDBOX_SERVICE_API_KEY
          valueFrom:
            secretKeyRef:
              name: n8n-sandbox
              key: SANDBOX_API_KEYS
        # Web search for the AI assistant (see n8n-searxng-prod.yaml)
        - name: N8N_INSTANCE_AI_SEARXNG_URL
          value: "http://searxng:8080"
        # Model API key for the AI assistant (Secret n8n-instance-ai, gitignored)
        - name: N8N_INSTANCE_AI_MODEL_API_KEY
          valueFrom:
            secretKeyRef:
              name: n8n-instance-ai
              key: N8N_INSTANCE_AI_MODEL_API_KEY
              optional: true
        # Task runners run as the "runners" sidecar below; the broker stays on
        # 127.0.0.1:5679 (pod-local), so it is never exposed via a Service.
        - name: N8N_RUNNERS_MODE
          value: "external"
        # Pin the current default (n8n plans to lower it to 60s)
        - name: N8N_RUNNERS_TASK_TIMEOUT
          value: "300"
        - name: N8N_RUNNERS_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: n8n-runners
              key: N8N_RUNNERS_AUTH_TOKEN
        volumeMounts:
        - name: n8n-config
          mountPath: "/home/node/.n8n"
        ports:
        - name: http
          containerPort: 5678
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5678
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5678
      # Runs Code-node user code (JavaScript and Python). Image tag must match
      # the n8n version above.
      - name: runners
        image: ghcr.io/n8n-io/runners:2.49.3
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        env:
        - name: TZ
          value: "America/New_York"
        - name: N8N_RUNNERS_TASK_BROKER_URI
          value: "http://127.0.0.1:5679"
        - name: N8N_RUNNERS_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: n8n-runners
              key: N8N_RUNNERS_AUTH_TOKEN
        # Idle runners exit and are relaunched on demand
        - name: N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT
          value: "15"
      volumes:
      - name: n8n-config
        hostPath:
          path: "/mnt/k3s-prod-data/n8n"

---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: n8n
spec:
  selector:
    app: n8n
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 5678
    protocol: TCP

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: n8n-ingress
  namespace: n8n
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`n8n-prod.goepp.net`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: n8n
          port: 80

