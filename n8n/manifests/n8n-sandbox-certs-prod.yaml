# One-off mTLS bootstrap for the n8n sandbox service (n8n-sandbox-prod.yaml).
# Apply this once, before the sandbox manifest; the API and runner pods stay in
# ContainerCreating until the Secrets it creates exist.
#
# Kept out of n8n-sandbox-prod.yaml on purpose: a Job's pod template is
# immutable, so bumping the sandbox version in the same file would make every
# upgrade apply fail on this Job. Its bootstrap image only needs to be a
# sandbox release that ships bootstrap-mtls.sh; bump it when rotating.
#
# To rotate the mTLS certificates:
#   kubectl -n n8n delete job n8n-sandbox-certs
#   kubectl -n n8n delete secret n8n-sandbox-tls-api n8n-sandbox-tls-runner
#   kubectl apply -f n8n/manifests/n8n-sandbox-certs-prod.yaml
#   kubectl -n n8n rollout restart deploy/sandbox-api deploy/sandbox-runner-1

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: n8n-sandbox-certs
  namespace: n8n

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: n8n-sandbox-certs
  namespace: n8n
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: n8n-sandbox-certs
  namespace: n8n
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: n8n-sandbox-certs
subjects:
- kind: ServiceAccount
  name: n8n-sandbox-certs
  namespace: n8n

---
# One-off job (compose: sandbox-certs). Generates the mTLS CA and certs into an
# emptyDir, then stores them as two Secrets that the API and runner pods mount.
# Those pods stay in ContainerCreating until the Secrets exist.
apiVersion: batch/v1
kind: Job
metadata:
  name: n8n-sandbox-certs
  namespace: n8n
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: n8n-sandbox-certs
    spec:
      serviceAccountName: n8n-sandbox-certs
      restartPolicy: Never
      enableServiceLinks: false
      initContainers:
      - name: bootstrap-mtls
        image: ghcr.io/n8n-io/n8n-sandbox-service-api:1.8.1
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        command: ["sh", "-c"]
        args:
        - >
          bootstrap-mtls.sh --out-dir /tls --api-san sandbox-api
          --control-san-prefix sandbox-runner --world-readable
        env:
        - name: NUM_RUNNERS
          value: "1"
        volumeMounts:
        - name: tls
          mountPath: /tls
      containers:
      - name: secret-api
        image: registry.k8s.io/kubectl:v1.37.1
        args: ["create", "secret", "generic", "n8n-sandbox-tls-api", "--from-file=/tls/api"]
        volumeMounts:
        - name: tls
          mountPath: /tls
          readOnly: true
      - name: secret-runner
        image: registry.k8s.io/kubectl:v1.37.1
        args: ["create", "secret", "generic", "n8n-sandbox-tls-runner", "--from-file=/tls/runner"]
        volumeMounts:
        - name: tls
          mountPath: /tls
          readOnly: true
      volumes:
      - name: tls
        emptyDir:
          medium: Memory
