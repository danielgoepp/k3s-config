---
apiVersion: v1
kind: Namespace
metadata:
  name: management

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: propane-sync
  namespace: management
spec:
  schedule: "0 0 * * *"
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: propane-sync
            image: ghcr.io/danielgoepp/propane-sync:latest
            imagePullPolicy: IfNotPresent
            env:
              - name: SOURCE_URL
                value: "https://vms-prod.goepp.net"
              - name: TARGET_URL
                value: "https://vms-prod-lt.goepp.net"
          restartPolicy: Never