---
apiVersion: v1
kind: Namespace
metadata:
  name: miniflux

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: miniflux
  namespace: miniflux
  labels:
    app: miniflux
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: miniflux
  revisionHistoryLimit: 0
  template:
    metadata:
      labels:
        app: miniflux
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
      - name: miniflux
        image: ghcr.io/miniflux/miniflux:2.3.5
        imagePullPolicy: IfNotPresent
        env:
          - name: TZ
            value: "America/New_York"
          - name: BASE_URL
            value: "https://miniflux-prod.goepp.net"
          - name: LISTEN_ADDR
            value: "0.0.0.0:8080"
          - name: RUN_MIGRATIONS
            value: "1"
          - name: CREATE_ADMIN
            value: "1"
          - name: METRICS_COLLECTOR
            value: "1"
          - name: METRICS_ALLOWED_NETWORKS
            value: "192.168.0.0/16"
        envFrom:
          - secretRef:
              name: miniflux-secrets
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        ports:
        - name: http
          containerPort: 8080
        startupProbe:
          httpGet:
            path: /healthcheck
            port: 8080
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /healthcheck
            port: 8080
        livenessProbe:
          httpGet:
            path: /healthcheck
            port: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: miniflux
  namespace: miniflux
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
spec:
  selector:
    app: miniflux
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: miniflux-ingress
  namespace: miniflux
spec:
  entryPoints:
    - websecure
  routes:
    # /metrics is excluded so it is only reachable in-cluster (vmagent scrapes pod IPs directly)
    - match: Host(`miniflux-prod.goepp.net`) && PathPrefix(`/`) && !PathPrefix(`/metrics`)
      kind: Rule
      services:
        - name: miniflux
          port: 80
