image:
  registry: docker.io
  repository: dpage/pgadmin4
  tag: 9.19.0
  pullPolicy: IfNotPresent

serverDefinitions:
  enabled: true
  # Server list is generated from the CNPG clusters by ../sync-cnpg-servers.sh,
  # which owns this ConfigMap (and the pgpassfile Secret). Re-run it after
  # adding or removing a CNPG cluster.
  resourceType: ConfigMap
  existingConfigmap: pgadmin-cnpg-servers

ingress:
  enabled: true
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  ingressClassName: traefik
  hosts:
    - host: pgadmin-prod.goepp.net
      paths:
        - path: /
          pathType: Prefix
  tls: []

extraSecretMounts:
- name: pgpassfile
  secret: pgpassfile
  subPath: pgpassfile
  mountPath: "/tmp/pgpass"
  readOnly: true

VolumePermissions:
  enabled: true

extraInitContainers: |
  - name: prepare-pgpass
    image: docker.io/dpage/pgadmin4:9.19.0
    command: [ 'sh', '-c', "cp /tmp/pgpass /var/lib/pgadmin/pgpass && chown pgadmin /var/lib/pgadmin/pgpass && chmod 600 /var/lib/pgadmin/pgpass " ]
    volumeMounts:
      - name: pgadmin-data
        mountPath: /var/lib/pgadmin
      - name: pgpassfile
        secret: pgpassfile
        subPath: pgpassfile
        mountPath: "/tmp/pgpass"
        readOnly: true
    securityContext:
      runAsUser: 0

existingSecret: "pgadmin-secrets"
secretKeys:
  pgadminPasswordKey: password

env:
  email: dan@goepp.com
  pgpassfile: "/var/lib/pgadmin/pgpass"

persistentVolume:
  enabled: false