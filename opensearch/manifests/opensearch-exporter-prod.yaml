---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch-exporter
  namespace: opensearch
  labels:
    app: opensearch-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensearch-exporter
  strategy:
    type: Recreate
  revisionHistoryLimit: 0
  template:
    metadata:
      labels:
        app: opensearch-exporter
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
      - name: opensearch-exporter
        image: prometheuscommunity/elasticsearch-exporter:v1.11.0
        imagePullPolicy: IfNotPresent
        args:
        - --es.uri=http://opensearch-prod-cluster-master.opensearch.svc.cluster.local.:9200
        - --es.timeout=10s
        resources:
          requests:
            cpu: "25m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
        ports:
        - name: metrics
          containerPort: 9114

---
apiVersion: v1
kind: Service
metadata:
  name: opensearch-exporter
  namespace: opensearch
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9114"
spec:
  selector:
    app: opensearch-exporter
  type: ClusterIP
  ports:
  - name: metrics
    port: 9114
    targetPort: metrics
